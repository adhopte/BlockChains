version: "3.9"

services:
  emrtd-backend:
    build: .
    image: emrtd-validation-service:latest
    container_name: emrtd-backend
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
